<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projets PolyFinances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EE; --surface:#FFFFFF; --surface-2:#F3EFE8; --ink:#22171A; --ink-2:#5E5254; --ink-3:#938789;
  --line:#E7E0D7; --brand:#40080D; --brand-ink:#FFFFFF;
  --gold:#B57A18; --gold-soft:#F6EBD6; --gold-ink:#FFFFFF; --gold-text:#8A5A0C;
  --bord:#40080D; --bord-soft:#F1E1E2; --bord-text:#40080D; --bord-ink:#FFFFFF;
  --mem:#CFC6BD; --mem-soft:#EEE9E3; --mem-text:#5E5254;
  --danger:#A3242F; --ok:#2B8A55; --shadow:0 1px 2px rgba(64,8,13,.05),0 6px 18px rgba(64,8,13,.06);
  --face:40px; --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140F11; --surface:#1D1618; --surface-2:#261D20; --ink:#F4EDEB; --ink-2:#C7BABB; --ink-3:#8D8082;
    --line:#382C2F; --brand:#7A1C25; --brand-ink:#FFFFFF;
    --gold:#D49D3D; --gold-soft:#3A2B13; --gold-ink:#1D1618; --gold-text:#E2B565;
    --bord:#C2505C; --bord-soft:#3D1D22; --bord-text:#F0B9BF; --bord-ink:#FFFFFF;
    --mem:#5A4E51; --mem-soft:#2E2528; --mem-text:#C7BABB;
    --danger:#E0707A; --ok:#5CC48A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140F11; --surface:#1D1618; --surface-2:#261D20; --ink:#F4EDEB; --ink-2:#C7BABB; --ink-3:#8D8082;
  --line:#382C2F; --brand:#7A1C25; --brand-ink:#FFFFFF;
  --gold:#D49D3D; --gold-soft:#3A2B13; --gold-ink:#1D1618; --gold-text:#E2B565;
  --bord:#C2505C; --bord-soft:#3D1D22; --bord-text:#F0B9BF; --bord-ink:#FFFFFF;
  --mem:#5A4E51; --mem-soft:#2E2528; --mem-text:#C7BABB;
  --danger:#E0707A; --ok:#5CC48A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Poppins,"Segoe UI",system-ui,sans-serif;font-size:13px;line-height:1.35;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}

/* hidden scrollbars + edge fades */
.scroller{overflow:auto;scrollbar-width:none;-ms-overflow-style:none}
.scroller::-webkit-scrollbar{display:none}
.scroller.ft{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px);mask-image:linear-gradient(to bottom,transparent 0,#000 28px)}
.scroller.fb{-webkit-mask-image:linear-gradient(to top,transparent 0,#000 28px);mask-image:linear-gradient(to top,transparent 0,#000 28px)}
.scroller.ft.fb{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:20px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.02em;flex:none}
.brand h1{margin:0;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap}
.brand p{margin:0;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mem);flex:none}
.sync[data-s="on"]{color:var(--ok)}
.sync[data-s="on"] i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.sync[data-s="off"]{color:var(--danger)}
.sync[data-s="off"] i{background:var(--danger)}
.tabs{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;margin-left:auto;margin-right:auto}
.tab{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.tab .n{font-size:11px;color:var(--ink-3);font-weight:500}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.tab[aria-selected="true"] .n{color:var(--brand-ink);opacity:.75}
.actions{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--ink-3);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:14px;height:14px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- layout ---------- */
.layout{flex:1;display:flex;min-height:0}
.roster{width:324px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:background .15s}
.roster.drop-remove{background:var(--bord-soft)}
.rhead{padding:9px 18px 7px;border-bottom:1px solid var(--line)}
.size{display:flex;background:var(--surface-2);border-radius:9px;padding:2px;margin-right:6px}
.size button{border:0;background:transparent;border-radius:7px;width:28px;height:26px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.size button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rtitle{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rtitle h2{margin:0;font-size:14px;font-weight:600}
.rtitle .scope{font-size:11px;color:var(--ink-3)}
.legend{display:flex;gap:12px;margin-top:4px;font-size:11px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:5px}
.lg{width:12px;height:12px;border-radius:50%;background:var(--surface-2)}
.lg.chef{box-shadow:inset 0 0 0 2.5px var(--gold)}
.lg.del{box-shadow:inset 0 0 0 2.5px var(--bord)}
.lg.mem{box-shadow:inset 0 0 0 1px var(--mem)}
.seg{display:flex;margin-top:8px;background:var(--surface-2);border-radius:8px;padding:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:4px 0;font-size:11.5px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rlist{flex:1;min-height:0;padding:2px 18px 4px}
.rfoot{padding:6px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-3);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rfoot b{color:var(--ink-2);font-weight:500}

.grp{padding:3px 0 0}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;font-weight:600;color:var(--bord-text);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.grp-h .grp-n{color:var(--ink-3);font-weight:500}
.tiles{display:flex;align-items:flex-start;gap:5px}
.vsep{width:1px;align-self:stretch;margin:6px 0 22px;background:var(--line)}
.tile{width:min(66px, calc(var(--face) + 22px));display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:10px;padding:1px 0}
.tname{font-size:10.5px;font-weight:500;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.cnt{display:flex;gap:2px}
.k{min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:10px;font-weight:600;font-style:normal;display:inline-grid;place-items:center;line-height:1}
.k-chef{background:var(--gold);color:var(--gold-ink)}
.k-del{background:var(--bord);color:var(--bord-ink)}
.k-mem{background:var(--mem-soft);color:var(--mem-text)}
.k.z{opacity:.22}

/* faces */
.face{width:var(--face);height:var(--face);border-radius:50%;background-size:cover;background-position:center;background-color:var(--surface-2);
  display:block;flex:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 0 0 1px var(--line);transition:opacity .15s, filter .15s, transform .12s}
.face:hover{transform:scale(1.04)}
.tile.idle .face{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--ink-3);filter:saturate(.35);opacity:.7}
.r-chef > .face{box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--gold)}
.r-del > .face{box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--bord)}
.face.lifting{opacity:.25}

/* charge view */
.lrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.lmeta{flex:1;min-width:0;display:flex;flex-direction:column}
.lname{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltitle{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blocks{display:flex;gap:2px;width:96px;flex-wrap:wrap;justify-content:flex-end}
.blocks i{width:9px;height:14px;border-radius:3px;display:block}
.blocks .b-chef{background:var(--gold)} .blocks .b-del{background:var(--bord)} .blocks .b-mem{background:var(--mem)}
.blocks .none{font-size:10.5px;color:var(--ink-3);font-style:italic;width:auto;height:auto;background:none}
.ltot{width:20px;text-align:right;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}

/* ---------- board ---------- */
.board{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.bhead{display:flex;align-items:center;gap:16px;padding:14px 22px 10px;flex:none;min-height:62px}
.bhead h2{margin:0;font-size:18px;font-weight:600;color:var(--bord-text)}
.bhead .sub{margin:2px 0 0;font-size:11.5px;color:var(--ink-3)}
.focusbar{margin-left:auto;display:none;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 6px;box-shadow:var(--shadow);max-width:60%}
.focusbar.on{display:flex}
.focusbar .face{--face:34px;cursor:default}
.focusbar .fb-t{display:flex;flex-direction:column;min-width:0}
.focusbar .fb-n{font-weight:600;font-size:12.5px}
.focusbar .fb-s{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:transparent;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib svg{width:16px;height:16px}
.bscroll{flex:1;min-height:0;padding:4px 22px 28px}
.season-h{display:flex;align-items:baseline;gap:10px;margin:14px 0 10px}
.season-h:first-child{margin-top:4px}
.season-h h3{margin:0;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.season-h span{font-size:11.5px;color:var(--ink-3)}
.cols{display:flex;gap:14px;align-items:flex-start}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:10px 12px 8px;transition:opacity .15s}
.ch{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.pname{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:3px 6px;margin-left:-6px;font-size:14px;font-weight:600;color:var(--bord-text);text-overflow:ellipsis}
.pname:hover{border-color:var(--line)}
.pname:focus{outline:none;border-color:var(--gold);background:var(--surface-2)}
.mix{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mix .d{width:7px;height:7px;border-radius:50%;margin-left:4px}
.mix .d:first-child{margin-left:0}
.d-chef{background:var(--gold)} .d-del{background:var(--bord)} .d-mem{background:var(--mem)}
.mix .tot{font-weight:600;color:var(--ink);margin-left:6px}

.zone{border-radius:11px;margin:0 -6px;padding:6px 6px 4px;border:1.5px dashed transparent;transition:background .12s,border-color .12s}
.zf{display:flex;flex-wrap:wrap;gap:8px 6px;align-content:flex-start}
.zone.is-empty .zf{min-height:calc(var(--face) + 18px);align-items:center;justify-content:center}
.empty{font-size:11.5px;color:var(--ink-3);font-style:italic}
body.dragging .zone{border-color:var(--line)}
.zone.hover{background:var(--surface-2);border-color:var(--gold)}
.mix .warn{color:var(--danger);font-weight:600}
.pt .face{cursor:pointer}
body.dragging .pt .face{cursor:grabbing}

.pt{position:relative;min-width:calc(var(--face) + 10px);max-width:calc(var(--face) + 26px);display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:3px}
.pt.r-del{min-width:calc(var(--face) + 16px)}
.pt .tname{font-size:10px}
.x{position:absolute;top:-1px;right:calc(50% - var(--face) / 2 - 4px);width:17px;height:17px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font-size:12px;line-height:1;display:grid;place-items:center;opacity:0;transition:opacity .12s;padding:0}
.pt:hover .x,.x:focus-visible{opacity:1}
.chip{border:0;background:var(--bord-soft);color:var(--bord-text);font-size:9px;font-weight:600;border-radius:999px;padding:1px 5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-1px}
.chip:hover{background:var(--bord);color:var(--bord-ink)}

.newcard{border:1.5px dashed var(--line);border-radius:var(--radius);background:transparent;padding:18px 12px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.newcard:hover{border-color:var(--gold);color:var(--ink);background:var(--surface)}
.newcard svg{width:16px;height:16px}
.emptyseason{font-size:12px;color:var(--ink-3);margin:-2px 0 12px}
.yr{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;color:var(--ink-2);margin:-4px 0 2px;cursor:default}
.yr svg{width:12px;height:12px;flex:none;color:var(--gold)}

/* focus mode */
body.focusing .card:not(.has){opacity:.45}
body.focusing .pt:not(.hit) .face{opacity:.35}
body.focusing .tile:not(.hit) .face, body.focusing .lrow:not(.hit) .face{opacity:.4}
.tile.hit,.lrow.hit{background:var(--gold-soft)}
.lrow{border-radius:10px;padding-left:4px;padding-right:4px;margin:0 -4px}

/* ghost */
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;display:none;flex-direction:column;align-items:center;gap:6px;transform:translate(-50%,-50%)}
.ghost.on{display:flex}
.ghost .face{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line),0 10px 24px rgba(0,0,0,.25);cursor:grabbing;transform:scale(1.08)}
.ghost.g-chef .face{box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--gold),0 10px 24px rgba(0,0,0,.25)}
.ghost.g-del .face{box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--bord),0 10px 24px rgba(0,0,0,.25)}
.gcap{background:var(--ink);color:var(--surface);font-size:11px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.gcap:empty{display:none}
body.dragging,body.dragging *{cursor:grabbing !important}

/* popover menu */
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:5px;min-width:200px;display:none}
.pop.on{display:block}
.pop .mh{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:6px 9px 4px}
.pop button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:7px 9px;border-radius:7px;font-size:12.5px}
.pop button:hover{background:var(--surface-2)}
.pop button.danger{color:var(--danger)}
.pop button .chk{width:14px;color:var(--gold);font-weight:700}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);border-radius:12px;padding:9px 10px 9px 16px;display:flex;align-items:center;gap:14px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--gold);font-weight:600;padding:4px 8px;border-radius:7px}
.toast button:hover{background:rgba(255,255,255,.1)}

@media (max-width:860px){
  body{overflow:auto;height:auto}
  .layout{flex-direction:column}
  .roster{width:100%;border-right:0;border-bottom:1px solid var(--line);max-height:46vh}
  .top{flex-wrap:wrap;gap:10px;padding:10px 16px}
  .tabs{margin:0}
  .actions{flex-wrap:wrap}
  .bscroll{padding:4px 16px 24px}
  .bhead{padding:12px 16px 8px;flex-wrap:wrap}
  .focusbar{max-width:100%;margin-left:0}
}
</style>
<style id="photo-css"></style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">PF</div>
    <div><h1>Projets PolyFinances</h1><p>Cohorte 2026-2027 · 21 membres · 6 pôles · <span class="sync" id="sync" data-s="local"><i></i><span id="synctxt">Local</span></span></p></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="actions">
    <div class="size" role="group" aria-label="Taille des visages" title="Taille des visages" id="size">
      <button data-size="s" aria-pressed="false" aria-label="Petits visages">S</button><button data-size="m" aria-pressed="true" aria-label="Visages moyens">M</button><button data-size="l" aria-pressed="false" aria-label="Grands visages">L</button>
    </div>
    <button class="btn" id="undo" disabled title="Annuler (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Annuler</button>
    <button class="btn" id="export" title="Télécharger une sauvegarde JSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Exporter</button>
    <button class="btn" id="import" title="Charger une sauvegarde JSON"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>Importer</button>
    <button class="btn" id="reset" title="Remettre la répartition de départ (pour tout le monde)">Réinitialiser</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>
</header>

<div class="layout">
  <aside class="roster" id="roster" aria-label="Équipe">
    <div class="rhead">
      <div class="rtitle"><h2>Équipe · 21</h2><span class="scope" id="scope"></span></div>
      <div class="legend">
        <span><i class="lg chef"></i>Chef</span>
        <span><i class="lg del"></i>Délégué</span>
        <span><i class="lg mem"></i>Membre</span>
      </div>
      <div class="seg" role="group" aria-label="Affichage de l'équipe">
        <button id="v-poles" aria-pressed="true">Par pôle</button>
        <button id="v-charge" aria-pressed="false">Par charge</button>
      </div>
    </div>
    <div class="rlist scroller" id="rlist"></div>
    <div class="rfoot" title="Glisser un visage dans un projet pour l'affecter (le premier devient chef) · Clic sur un visage dans un projet = changer l'anneau (membre → délégué → chef) · Ctrl en glissant = copier vers un autre projet · Clic sur un visage de l'équipe = suivre la personne · Glisser un visage d'un projet vers l'équipe = le retirer"><b>Glisser</b> = affecter · <b>Clic</b> dans un projet = rôle<br><b>Ctrl</b> = copier · <b>Clic</b> ici = suivre · glisser ici = retirer</div>
  </aside>

  <main class="board">
    <div class="bhead">
      <div><h2 id="btitle"></h2><p class="sub" id="bsub"></p></div>

function sanitize(o){
  if (!o || !Array.isArray(o.projects)) return null;
  const projects = o.projects.filter(p => p && typeof p.name === 'string' && SEASONS[p.season] && Array.isArray(p.members)).map((p, i) => {
    const seen = new Set();
    return {id: typeof p.id === 'string' ? p.id : uid(), name: p.name.slice(0,120), season: p.season, o: Number.isFinite(p.o) ? p.o : i,
      members: p.members.filter(m => m && PEOPLE[m.p] && ROLE[m.r] && !seen.has(m.p) && seen.add(m.p))
        .map((m, j) => { const o = {p:m.p, r:m.r, o: Number.isFinite(m.o) ? m.o : j}; if (POLES[m.pole]) o.pole = m.pole; return o; })};
  });
  if ((o.v || 1) < 2) migrateYearLong(projects);
  projects.forEach((p, i) => { if (!Number.isFinite(p.o)) p.o = projects.length + i; });
  return {v:2, projects: sortProjects(projects)};
}

const YEARLONG = [

const RANK = {chef:3, del:2, mem:1};
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ');
function migrateYearLong(projects){
  for (const [name, re] of YEARLONG) {
    const hits = projects.filter(p => re.test(norm(p.name)));
    if (!hits.length) { projects.push({id:uid(), name, season:'annuel', members:[]}); continue; }
    const keep = hits[0]; keep.season = 'annuel';
    for (const dup of hits.slice(1)) {
      for (const m of dup.members) {
        const cur = keep.members.find(x => x.p === m.p);
        if (!cur) keep.members.push(m);
        else if (RANK[m.r] > RANK[cur.r]) { cur.r = m.r; if (m.pole) cur.pole = m.pole; }
      }
      projects.splice(projects.indexOf(dup), 1);
    }
  }
}

// C'est ce qui est envoyé à la base et ce que retient « Annuler » : seules les lignes touchées par une action.
const projRow = p => ({id:p.id, name:p.name, season:p.season, o:p.o});
const affRow = (p, m) => ({id:p.id + '|' + m.p, projet:p.id, personne:m.p, r:m.r, pole:m.pole || null, o:m.o});
function rowsOf(projects){
  const rows = new Map();
  for (const p of projects) {
    rows.set('p:' + p.id, projRow(p));
    for (const m of p.members) rows.set('a:' + p.id + '|' + m.p, affRow(p, m));
  }
  return rows;
}
// [clé, ligne avant, ligne après] pour chaque ligne qui a changé (null = absente).
function diffRows(before, after){
  const b = rowsOf(before), out = [];
  for (const [k, v] of rowsOf(after)) { const w = b.get(k); if (!w || JSON.stringify(w) !== JSON.stringify(v)) out.push([k, w || null, v]); b.delete(k); }
  for (const [k, w] of b) out.push([k, w, null]);
  return out;
}
// Applique des lignes [clé, ligne|null] à une liste de projets (projets créés d'abord, supprimés en dernier).
function applyRows(projects, list){
  const byId = new Map(projects.map(p => [p.id, p]));
  for (const [k, row] of list) if (k[0] === 'p' && row) {
    const p = byId.get(row.id);
    if (p) { p.name = row.name; p.season = row.season; p.o = row.o; }
    else { const np = {id:row.id, name:row.name, season:row.season, o:row.o, members:[]}; projects.push(np); byId.set(np.id, np); }
  }
  for (const [k, row] of list) if (k[0] === 'a') {
    const [pid, who] = k.slice(2).split('|'), p = byId.get(pid);
    if (!p) continue;
    p.members = p.members.filter(m => m.p !== who);
    if (row) { const m = {p:who, r:row.r, o:row.o}; if (row.pole) m.pole = row.pole; p.members.push(m); }
  }
  for (const [k, row] of list) if (k[0] === 'p' && !row) {
    const i = projects.findIndex(p => p.id === k.slice(2)); if (i >= 0) projects.splice(i, 1);
  }
  return projects;
}
function fromRows(rows){
  const projects = [];
  for (const [k, r] of rows) if (k[0] === 'p') projects.push({id:r.id, name:r.name, season:r.season, o:r.o, members:[]});
  return applyRows(projects, [...rows].filter(([k]) => k[0] === 'a'));
}

function commit(fn, msg){

    if (!list.length) return;
    const q = sb.from(TABLE[t]);
    const r = live ? await q.upsert(list.map(([, v]) => v)) : await q.delete().in('id', list.map(([k]) => k.slice(2)));
    if (r.error) err = r.error;
  };
  // Projets créés avant leurs affectations ; projets supprimés en dernier.
  try { await run('p', true); await run('a', true); await run('a', false); await run('p', false); } catch (e) { err = e; }
  flushing = false;
  const refused = !!(err && err.code && /^(22|23|42|PGRST)/.test(err.code));   // refus définitif : inutile de réessayer
  if (err && !refused) { console.warn('Supabase', err); setSync('off'); schedule(4000); return; }
  for (const [k, v] of batch) {
    if (outbox.get(k) === v) outbox.delete(k);
    if (!err && mirror) { if (v) mirror.set(k, v); else mirror.delete(k); }
  }
  if (refused) { console.warn('Supabase', err); toast('Modification refusée par la base', false); loadAll(); }
  else if (chanLive) setSync('on');
  if (outbox.size) schedule(50);
}
async function loadAll(){
  if (!sb) return false;
  let p, a;
  try {
    [p, a] = await Promise.all([sb.from('projets').select('id,name,season,o'),
                                sb.from('affectations').select('id,projet,personne,r,pole,o')]);
  } catch (e) { p = {error: e}; }
  const error = p.error || (a && a.error);
  if (error) { console.warn('Supabase', error); setSync('off'); return false; }
  mirror = new Map();
  for (const r of p.data) mirror.set('p:' + r.id, r);
  for (const r of a.data) mirror.set('a:' + r.id, r);
  setSync(chanLive ? 'on' : 'wait');
  applyRemote(); return true;
}
function staleEcho(k, r){
  const l = sent.get(k); if (!l) return false;
  const i = l.findIndex(x => x.s === canon(k, r));
  return i >= 0 && i < l.length - 1;    // écho d'une de MES versions déjà remplacée par une plus récente
}
const onChange = t => ev => {
  if (!mirror) return;
  if (ev.eventType === 'DELETE') { const id = ev.old && ev.old.id; if (!id) return; mirror.delete(t + ':' + id); }
  else { const r = ev.new; if (!r || !r.id) return; const k = t + ':' + r.id; if (staleEcho(k, r)) return; mirror.set(k, r); }
  applyRemote();
};
// Pendant un glisser, un menu ouvert ou la saisie d'un nom, on attend avant d'afficher les modifs des autres.
const busy = () => !!drag || $('pop').classList.contains('on') ||
  !!(document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('pname'));
function fromMirror(){
  const rows = new Map(mirror);
  for (const [k, v] of outbox) { if (v) rows.set(k, v); else rows.delete(k); }
  return sanitize({v:2, projects:fromRows(rows)}) || {v:2, projects:[]};
}
function applyRemote(){
  if (!mirror) return;
  if (busy()) { pendingRemote = true; return; }
  pendingRemote = false;
  const s = fromMirror();
  if (JSON.stringify(s.projects) === JSON.stringify(state.projects)) return;
  state = s; save(); render();
}
function flushRemote(){ if (pendingRemote) applyRemote(); }

const SYNC = {
  local:['Local', 'Pas de base partagée : tes modifs restent dans ce navigateur'],
  wait:['Connexion…', 'Connexion à la base partagée…'],
  on:['En direct', 'Synchronisé : chaque modif apparaît chez tout le monde en direct'],
  off:['Hors ligne', 'Connexion perdue : tes modifs seront envoyées au retour du réseau']
};
function setSync(s){
  if (s === syncState) return; syncState = s;
  const el = $('sync'); el.dataset.s = s; el.title = SYNC[s][1]; $('synctxt').textContent = SYNC[s][0];
}
function startSync(){
  if (!sb) { setSync('local'); return; }
  setSync('wait');
  sb.channel('projets-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'projets'}, onChange('p'))
    .on('postgres_changes', {event:'*', schema:'public', table:'affectations'}, onChange('a'))
    // L'écoute de la base devient active quelques secondes après la connexion : on recharge tout à ce moment-là
    // pour rattraper ce qui a changé entre-temps, et seulement alors on affiche « En direct ».
    .on('system', {}, m => {
      if (m && m.extension === 'postgres_changes' && m.status === 'ok') { chanLive = true; loadAll(); flush(); }
    })
    .subscribe(status => {
      if (status === 'SUBSCRIBED') { loadAll(); flush(); }
      else { chanLive = false; setSync('off'); }
    });
  loadAll();
  setInterval(() => { if (!document.hidden) loadAll(); if (outbox.size) flush(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(); });
  window.addEventListener('online', () => { loadAll(); flush(); });
}

photoCSS();
applySize();
lastCols = colCount();
render();
startSync();
</script>
